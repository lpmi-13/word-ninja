<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thai Word Slice</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #17212b;
  --panel: rgba(24, 32, 43, 0.86);
  --line: rgba(255, 255, 255, 0.24);
  --gold: #ffd166;
  --red: #ef476f;
  --green: #24a66a;
  --blue: #118ab2;
  --paper: #fffaf0;
}

body {
  overflow: hidden;
  background: #8bd1e7;
  color: var(--ink);
  font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

canvas {
  display: block;
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

#ui-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.hud-badge {
  position: absolute;
  min-width: 118px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: #ffffff;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.15;
  padding: 10px 14px;
  box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

#score-display {
  top: max(14px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  color: var(--gold);
}

#lives-display {
  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  min-width: 96px;
  text-align: right;
  color: #ff6b6b;
}

#mode-display {
  left: max(14px, env(safe-area-inset-left));
  bottom: max(14px, env(safe-area-inset-bottom));
  min-width: 108px;
  color: #a7f3d0;
}

#combo-display {
  top: calc(max(14px, env(safe-area-inset-top)) + 54px);
  left: max(14px, env(safe-area-inset-left));
  min-width: 96px;
  color: #fcbf49;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

#combo-display.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background:
    linear-gradient(180deg, rgba(139, 209, 231, 0.94), rgba(231, 238, 232, 0.94) 52%, rgba(87, 96, 111, 0.94));
  pointer-events: auto;
}

#game-over-screen { display: none; }

.menu {
  width: min(560px, 100%);
  border: 1px solid rgba(255, 255, 255, 0.48);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.9);
  padding: clamp(22px, 4vw, 34px);
  box-shadow: 0 24px 70px rgba(17, 24, 39, 0.28);
}

h1 {
  color: #16202a;
  font-size: clamp(36px, 8vw, 60px);
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0;
}

.subtitle {
  margin-top: 8px;
  color: #37515e;
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 800;
}

.example {
  margin: 20px 0;
  border-left: 6px solid var(--green);
  background: #f3fbf7;
  padding: 14px 16px;
  color: #16202a;
  font-size: clamp(22px, 6vw, 34px);
  font-weight: 900;
  line-height: 1.25;
}

.level-selector {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 20px 0 18px;
}

.level-btn,
.btn {
  min-height: 48px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 900;
}

.level-btn {
  border: 2px solid #cbd5e1;
  background: #ffffff;
  color: #203040;
  font-size: 15px;
  padding: 9px 8px;
}

.level-btn span {
  display: block;
  margin-top: 2px;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}

.level-btn.is-active {
  border-color: var(--blue);
  background: #e7f6fb;
  color: #0f5067;
}

.btn {
  width: 100%;
  background: #ef476f;
  color: #ffffff;
  font-size: 22px;
  padding: 13px 24px;
  box-shadow: 0 10px 20px rgba(239, 71, 111, 0.26);
}

.btn:focus-visible,
.level-btn:focus-visible {
  outline: 4px solid rgba(17, 138, 178, 0.35);
  outline-offset: 2px;
}

#final-label {
  margin-top: 24px;
  color: #435263;
  font-size: 18px;
  font-weight: 800;
}

#final-score {
  margin: 8px 0 22px;
  color: #d62828;
  font-size: clamp(46px, 12vw, 72px);
  font-weight: 900;
}

@media (max-width: 520px) {
  .hud-badge {
    min-width: 88px;
    padding: 8px 10px;
    font-size: 15px;
  }

  #combo-display {
    top: calc(max(14px, env(safe-area-inset-top)) + 46px);
  }

  .level-selector {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<canvas id="game-canvas" aria-label="Thai word slicing canvas"></canvas>

<div id="ui-overlay">
  <div id="score-display" class="hud-badge">Score 0</div>
  <div id="lives-display" class="hud-badge"></div>
  <div id="combo-display" class="hud-badge"></div>
  <div id="mode-display" class="hud-badge"></div>
</div>

<div id="start-screen" class="screen">
  <div class="menu">
    <h1>Thai Word Slice</h1>
    <div class="subtitle">เกมหั่นคำไทย</div>
    <div class="example">ฉัน|กิน|ข้าว -> ฉันกินข้าว</div>
    <div class="level-selector" role="group" aria-label="Reading level">
      <button class="level-btn is-active" type="button" data-level="easy">Easy<span>A1</span></button>
      <button class="level-btn" type="button" data-level="medium">Medium<span>A2</span></button>
      <button class="level-btn" type="button" data-level="difficult">Difficult<span>B1</span></button>
    </div>
    <button class="btn" id="start-btn" type="button">Play</button>
  </div>
</div>

<div id="game-over-screen" class="screen">
  <div class="menu">
    <h1>จบเกม</h1>
    <div id="final-label">Final Score</div>
    <div id="final-score">0</div>
    <button class="btn" id="restart-btn" type="button">Play Again</button>
  </div>
</div>

<script src="content/thai-game-data.js"></script>
<script>
const corpus = window.THAI_GAME_DATA;
if (!corpus || !Array.isArray(corpus.entries)) {
  throw new Error("Thai game data is missing. Run scripts/build-thai-game-data.mjs.");
}

const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score-display");
const livesEl = document.getElementById("lives-display");
const comboEl = document.getElementById("combo-display");
const modeEl = document.getElementById("mode-display");
const startScreen = document.getElementById("start-screen");
const gameOverScreen = document.getElementById("game-over-screen");
const finalScoreEl = document.getElementById("final-score");
const levelButtons = Array.from(document.querySelectorAll(".level-btn"));

const THAI_FONT = '"Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif';
const LEVEL_CONFIG = {
  easy: {
    label: "Easy",
    thaiLabel: "ง่าย",
    cefrLikeLevel: "A1",
    baseSpeed: 78,
    maxSpeed: 144,
    spawnInterval: 2050,
    toleranceScale: 0.58,
    chunkMin: 2,
    chunkMax: 3,
    scoreMultiplier: 1
  },
  medium: {
    label: "Medium",
    thaiLabel: "กลาง",
    cefrLikeLevel: "A2",
    baseSpeed: 98,
    maxSpeed: 178,
    spawnInterval: 2180,
    toleranceScale: 0.48,
    chunkMin: 3,
    chunkMax: 4,
    scoreMultiplier: 1.25
  },
  difficult: {
    label: "Difficult",
    thaiLabel: "ยาก",
    cefrLikeLevel: "B1",
    baseSpeed: 118,
    maxSpeed: 218,
    spawnInterval: 2320,
    toleranceScale: 0.39,
    chunkMin: 4,
    chunkMax: 5,
    scoreMultiplier: 1.55
  }
};

const entriesByLevel = corpus.entries.reduce((groups, entry) => {
  groups[entry.level] ??= [];
  groups[entry.level].push(entry);
  return groups;
}, {});

let W = 0;
let H = 0;
let dpr = 1;
let scene = {};
let selectedLevel = "easy";
let score = 0;
let lives = 3;
let combo = 0;
let runTime = 0;
let gameRunning = false;
let activeItems = [];
let fallingFragments = [];
let particles = [];
let scorePops = [];
let slashTrail = [];
let spawnTimer = 0;
let lastTime = 0;
let animFrame = null;
let conveyorOffset = 0;
let itemSequence = 0;
let isPointerDown = false;
let pointerPath = [];

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function randomInt(min, max) {
  return Math.floor(min + Math.random() * (max - min + 1));
}

function thaiFont(size, weight = 900) {
  return `${weight} ${size}px ${THAI_FONT}`;
}

function resize() {
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scene = getSceneMetrics();

  for (const item of activeItems) {
    item.y = scene.beltY - scene.beltHeight * 0.72;
  }

  if (!gameRunning) draw();
}

function getSceneMetrics() {
  const beltY = Math.round(H * (W < 720 ? 0.6 : 0.57));
  const beltHeight = clamp(H * 0.115, 64, 106);
  const beltTop = beltY - beltHeight / 2;
  const beltBottom = beltY + beltHeight / 2;
  const boxWidth = clamp(W * 0.34, 178, 310);
  const boxHeight = clamp(H * 0.16, 86, 132);
  const boxX = W / 2 - boxWidth / 2;
  const boxY = Math.min(H - boxHeight - 16, beltBottom + beltHeight * 0.32);

  return {
    beltY,
    beltHeight,
    beltTop,
    beltBottom,
    boxX,
    boxY,
    boxWidth,
    boxHeight,
    floorY: Math.max(H * 0.74, boxY + boxHeight * 0.62)
  };
}

function updateUI() {
  const cfg = LEVEL_CONFIG[selectedLevel];
  scoreEl.textContent = `Score ${score}`;
  livesEl.textContent = `${"♥".repeat(lives)}${"♡".repeat(Math.max(0, 3 - lives))}`;
  modeEl.textContent = `${cfg.label} ${cfg.cefrLikeLevel ?? ""}`.trim();

  if (combo > 1) {
    comboEl.textContent = `Combo x${combo}`;
    comboEl.classList.add("is-visible");
  } else {
    comboEl.classList.remove("is-visible");
  }
}

function setLevel(level) {
  if (!LEVEL_CONFIG[level]) return;
  selectedLevel = level;
  for (const button of levelButtons) {
    button.classList.toggle("is-active", button.dataset.level === level);
  }
  updateUI();
  draw();
}

function getRunProgress() {
  return clamp(runTime / 90000 + score / 4500, 0, 1);
}

function getCurrentSpeed() {
  const cfg = LEVEL_CONFIG[selectedLevel];
  return lerp(cfg.baseSpeed, cfg.maxSpeed, getRunProgress());
}

function getCurrentSpawnInterval() {
  const cfg = LEVEL_CONFIG[selectedLevel];
  return cfg.spawnInterval;
}

function pickEntry() {
  const pool = entriesByLevel[selectedLevel] ?? corpus.entries;
  return pool[Math.floor(Math.random() * pool.length)];
}

function getBoundaryOffsets(tokens) {
  let offset = 0;
  const offsets = [];
  for (let i = 0; i < tokens.length - 1; i++) {
    offset += tokens[i].length;
    offsets.push(offset);
  }
  return offsets;
}

function measureText(text, fontSize) {
  ctx.font = thaiFont(fontSize);
  return ctx.measureText(text).width;
}

function baseFontSize() {
  if (W < 430) return 32;
  if (W < 720) return clamp(W * 0.08, 32, 44);
  return clamp(W * 0.048, 40, 56);
}

function measureChallenge(tokens, fontSize) {
  const text = tokens.join("");
  const textWidth = measureText(text, fontSize);
  const boundaryOffsets = getBoundaryOffsets(tokens);
  const prefixWidths = boundaryOffsets.map((offset) => measureText(text.slice(0, offset), fontSize));

  return {
    text,
    tokens,
    textWidth,
    boundaryOffsets,
    prefixWidths,
    boundaryCount: boundaryOffsets.length
  };
}

function createChallenge() {
  const cfg = LEVEL_CONFIG[selectedLevel];
  const entry = pickEntry();
  const maxAllowed = cfg.chunkMax;
  let desiredMax = Math.min(entry.tokens.length, maxAllowed);
  let desiredMin = Math.min(cfg.chunkMin, desiredMax);

  if (desiredMax < 2) {
    desiredMax = Math.min(entry.tokens.length, 2);
    desiredMin = desiredMax;
  }

  let length = entry.tokens.length <= desiredMax
    ? entry.tokens.length
    : randomInt(desiredMin, desiredMax);
  let start = entry.tokens.length === length ? 0 : randomInt(0, entry.tokens.length - length);
  let tokens = entry.tokens.slice(start, start + length);
  const fontSize = baseFontSize();
  const maxItemWidth = W < 520 ? W * 0.76 : W * 0.58;
  let measured = measureChallenge(tokens, fontSize);

  while (tokens.length > 2 && measured.textWidth > maxItemWidth) {
    length -= 1;
    start = Math.min(start, entry.tokens.length - length);
    tokens = entry.tokens.slice(start, start + length);
    measured = measureChallenge(tokens, fontSize);
  }

  if (measured.textWidth > maxItemWidth) {
    const fittedSize = Math.max(32, Math.floor(fontSize * maxItemWidth / measured.textWidth));
    measured = measureChallenge(tokens, fittedSize);
    measured.fontSize = fittedSize;
  } else {
    measured.fontSize = fontSize;
  }

  return {
    ...measured,
    sourceId: entry.id,
    gloss: entry.gloss,
    level: entry.level,
    sublevel: entry.sublevel
  };
}

function spawnItem() {
  if (!gameRunning) return;

  const challenge = createChallenge();
  const padding = clamp(challenge.fontSize * 0.36, 12, 22);
  const height = clamp(challenge.fontSize * 1.42, 50, 78);
  const width = challenge.textWidth + padding * 2;
  const x = getNextSpawnX();

  activeItems.push({
    id: ++itemSequence,
    ...challenge,
    x,
    y: scene.beltY - scene.beltHeight * 0.72,
    width,
    height,
    padding,
    speed: getCurrentSpeed(),
    flash: 0,
    lastWrongAt: 0
  });
}

function getNextSpawnX() {
  return W + clamp(W * 0.025, 28, 56);
}

function getMinimumItemGap() {
  return clamp(W * 0.2, 160, 380);
}

function canSpawnNextItem() {
  const spawnX = getNextSpawnX();
  const maxRight = activeItems.reduce((right, item) => {
    return Math.max(right, item.x + item.width);
  }, -Infinity);

  return maxRight <= spawnX - getMinimumItemGap();
}

function getItemRect(item) {
  return {
    left: item.x,
    right: item.x + item.width,
    top: item.y - item.height / 2,
    bottom: item.y + item.height / 2
  };
}

function getBoundaryXs(item) {
  return item.prefixWidths.map((width) => item.x + item.padding + width);
}

function getBoundaryTolerance(item, boundaryIndex, boundaryXs) {
  const cfg = LEVEL_CONFIG[selectedLevel];
  const boundaryX = boundaryXs[boundaryIndex];
  const textLeft = item.x + item.padding;
  const textRight = textLeft + item.textWidth;
  const prevX = boundaryIndex === 0 ? textLeft : boundaryXs[boundaryIndex - 1];
  const nextX = boundaryIndex === boundaryXs.length - 1 ? textRight : boundaryXs[boundaryIndex + 1];
  const nearestGap = Math.max(1, Math.min(boundaryX - prevX, nextX - boundaryX));
  const fontBased = item.fontSize * cfg.toleranceScale;

  return clamp(Math.min(fontBased, nearestGap * 0.46), 13, item.fontSize * 0.64);
}

function findNearestBoundary(item, crossX) {
  const boundaryXs = getBoundaryXs(item);
  let best = null;

  for (let i = 0; i < boundaryXs.length; i++) {
    const distance = Math.abs(crossX - boundaryXs[i]);
    const tolerance = getBoundaryTolerance(item, i, boundaryXs);
    if (!best || distance < best.distance) {
      best = { index: i, x: boundaryXs[i], distance, tolerance };
    }
  }

  return best;
}

function sliceItem(item, boundaryIndex, sliceX) {
  const leftTokens = item.tokens.slice(0, boundaryIndex + 1);
  const rightTokens = item.tokens.slice(boundaryIndex + 1);
  const leftText = leftTokens.join("");
  const rightText = rightTokens.join("");
  const splitX = item.x + item.padding + item.prefixWidths[boundaryIndex];
  const textY = item.y;
  const fontSize = item.fontSize;
  const textLeft = item.x + item.padding;

  if (item.tokens.length === 2) {
    addFragment(leftText, textLeft, textY, -1, fontSize);
    addFragment(rightText, splitX + 4, textY, 1, fontSize);
    addSliceParticles(sliceX, textY, "#ffd166", 18);
    addScorePop(splitX, textY - fontSize * 0.8);
    awardSliceScore();
    return true;
  }

  if (rightTokens.length === 1) {
    addFragment(rightText, splitX + 4, textY, 1, fontSize);
    updateItemText(item, leftTokens, item.x);
  } else {
    addFragment(leftText, textLeft, textY, -1, fontSize);
    updateItemText(item, rightTokens, splitX - item.padding);
  }

  addSliceParticles(sliceX, textY, "#ffd166", 18);
  addScorePop(splitX, textY - fontSize * 0.8);
  awardSliceScore();
  return false;
}

function updateItemText(item, tokens, x) {
  const measured = measureChallenge(tokens, item.fontSize);
  item.tokens = measured.tokens;
  item.text = measured.text;
  item.textWidth = measured.textWidth;
  item.boundaryOffsets = measured.boundaryOffsets;
  item.prefixWidths = measured.prefixWidths;
  item.boundaryCount = measured.boundaryCount;
  item.width = measured.textWidth + item.padding * 2;
  item.x = x;
}

function awardSliceScore() {
  combo += 1;
  score += Math.round(10 * combo * LEVEL_CONFIG[selectedLevel].scoreMultiplier);
  updateUI();
}

function addFragment(text, x, y, side, fontSize) {
  const boxCenterX = scene.boxX + scene.boxWidth / 2;
  const driftToBox = clamp((boxCenterX - x) * 0.9, -170, 170);

  fallingFragments.push({
    text,
    x,
    y,
    vx: driftToBox + side * (30 + Math.random() * 45),
    vy: -85 - Math.random() * 45,
    gravity: 760 + Math.random() * 90,
    fontSize,
    rotation: side * 0.04,
    rotationSpeed: side * (0.9 + Math.random() * 0.5),
    alpha: 1,
    color: side < 0 ? "#118ab2" : "#24a66a",
    landed: false,
    landTime: 0
  });
}

function addSliceParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y + (Math.random() - 0.5) * 14,
      vx: (Math.random() - 0.5) * 190,
      vy: -80 - Math.random() * 170,
      gravity: 520,
      life: 460 + Math.random() * 260,
      maxLife: 720,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function addDustPuff(x, y) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 30,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 80,
      vy: -20 - Math.random() * 55,
      gravity: 190,
      life: 360 + Math.random() * 180,
      maxLife: 540,
      size: 3 + Math.random() * 5,
      color: "#d69f5f"
    });
  }
}

function addScorePop(x, y) {
  scorePops.push({
    text: `+${Math.round(10 * Math.max(1, combo + 1) * LEVEL_CONFIG[selectedLevel].scoreMultiplier)}`,
    x,
    y,
    vy: -36,
    life: 720,
    maxLife: 720
  });
}

function registerWrongSlice(item, x) {
  const now = performance.now();
  if (now - item.lastWrongAt < 360) return;

  item.lastWrongAt = now;
  item.flash = 1;
  combo = 0;
  addSliceParticles(x, item.y, "#ef476f", 8);
  updateUI();
}

function missItem() {
  lives -= 1;
  combo = 0;
  addSliceParticles(W * 0.08, scene.beltY, "#ef476f", 10);
  updateUI();

  if (lives <= 0) {
    endGame();
  }
}

function checkSlice(x1, y1, x2, y2) {
  for (let i = activeItems.length - 1; i >= 0; i--) {
    const item = activeItems[i];
    const rect = getItemRect(item);

    if (!lineIntersectsRect(x1, y1, x2, y2, rect.left, rect.top, rect.right, rect.bottom)) {
      continue;
    }

    const crossX = interpolateX(x1, y1, x2, y2, item.y);
    if (crossX === null || crossX < rect.left || crossX > rect.right) {
      continue;
    }

    const nearest = findNearestBoundary(item, crossX);
    if (nearest && nearest.distance <= nearest.tolerance) {
      const completed = sliceItem(item, nearest.index, nearest.x);
      if (completed) activeItems.splice(i, 1);
      return;
    }

    registerWrongSlice(item, crossX);
  }
}

function interpolateX(x1, y1, x2, y2, targetY) {
  if (Math.abs(y2 - y1) < 0.001) return (x1 + x2) / 2;

  const t = (targetY - y1) / (y2 - y1);
  if (t < -0.35 || t > 1.35) return null;
  return x1 + t * (x2 - x1);
}

function lineIntersectsRect(x1, y1, x2, y2, rx1, ry1, rx2, ry2) {
  const minX = Math.min(x1, x2);
  const maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2);
  return !(maxX < rx1 || minX > rx2 || maxY < ry1 || minY > ry2);
}

function update(dt) {
  const seconds = dt / 1000;
  runTime += dt;
  conveyorOffset = (conveyorOffset + getCurrentSpeed() * seconds) % 52;
  spawnTimer += dt;

  if (spawnTimer >= getCurrentSpawnInterval() && canSpawnNextItem()) {
    spawnItem();
    spawnTimer = 0;
  }

  for (let i = activeItems.length - 1; i >= 0; i--) {
    const item = activeItems[i];
    item.speed = getCurrentSpeed();
    item.x -= item.speed * seconds;
    item.flash = Math.max(0, item.flash - seconds * 4.4);

    if (item.x + item.width < -30) {
      activeItems.splice(i, 1);
      missItem();
    }
  }

  for (let i = fallingFragments.length - 1; i >= 0; i--) {
    const fragment = fallingFragments[i];
    fragment.x += fragment.vx * seconds;
    fragment.vy += fragment.gravity * seconds;
    fragment.y += fragment.vy * seconds;
    fragment.rotation += fragment.rotationSpeed * seconds;

    const landingY = scene.boxY + scene.boxHeight * 0.28 + Math.random() * 4;
    if (!fragment.landed && fragment.y >= landingY) {
      fragment.y = landingY;
      fragment.vx *= 0.22;
      fragment.vy = -Math.abs(fragment.vy) * 0.18;
      fragment.rotationSpeed *= 0.2;
      fragment.landed = true;
      addDustPuff(fragment.x, scene.boxY + scene.boxHeight * 0.36);
    }

    if (fragment.landed) {
      fragment.landTime += dt;
      fragment.alpha = clamp(1 - fragment.landTime / 900, 0, 1);
    }

    if (fragment.alpha <= 0 || fragment.y > H + 120) {
      fallingFragments.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];
    particle.x += particle.vx * seconds;
    particle.vy += particle.gravity * seconds;
    particle.y += particle.vy * seconds;
    particle.life -= dt;
    if (particle.life <= 0) particles.splice(i, 1);
  }

  for (let i = scorePops.length - 1; i >= 0; i--) {
    const pop = scorePops[i];
    pop.y += pop.vy * seconds;
    pop.life -= dt;
    if (pop.life <= 0) scorePops.splice(i, 1);
  }

  for (let i = slashTrail.length - 1; i >= 0; i--) {
    slashTrail[i].life -= dt / 280;
    if (slashTrail[i].life <= 0) slashTrail.splice(i, 1);
  }
}

function draw() {
  drawBackground();
  drawFactoryDetails();
  drawConveyor();
  drawItems();
  drawBoxBack();
  drawFragments();
  drawBoxFront();
  drawParticles();
  drawScorePops();
  drawSlashTrail();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#8bd1e7");
  sky.addColorStop(0.48, "#e5eef2");
  sky.addColorStop(1, "#66717f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#e9eef2";
  ctx.fillRect(0, H * 0.28, W, H * 0.45);

  ctx.fillStyle = "#57606f";
  ctx.fillRect(0, scene.floorY, W, H - scene.floorY);

  ctx.fillStyle = "#48515d";
  for (let x = -40; x < W + 80; x += 76) {
    ctx.fillRect(x, scene.floorY + 18, 42, 7);
  }
}

function drawFactoryDetails() {
  const windowTop = H * 0.12;
  const windowW = clamp(W * 0.12, 72, 132);
  const windowH = clamp(H * 0.11, 54, 96);

  for (let x = 34; x < W; x += windowW + 34) {
    ctx.fillStyle = "#b8e6f6";
    roundRect(ctx, x, windowTop, windowW, windowH, 7);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = "rgba(41, 66, 82, 0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + windowW / 2, windowTop + 4);
    ctx.lineTo(x + windowW / 2, windowTop + windowH - 4);
    ctx.moveTo(x + 4, windowTop + windowH / 2);
    ctx.lineTo(x + windowW - 4, windowTop + windowH / 2);
    ctx.stroke();
  }

  ctx.fillStyle = "#253746";
  ctx.fillRect(0, H * 0.27, W, 8);

  ctx.strokeStyle = "#ef476f";
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.28);
  ctx.lineTo(W, H * 0.2);
  ctx.stroke();

  ctx.strokeStyle = "#ffd166";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(W * 0.18, H * 0.04);
  ctx.lineTo(W * 0.18, H * 0.22);
  ctx.lineTo(W * 0.42, H * 0.22);
  ctx.stroke();
}

function drawConveyor() {
  const beltX = -20;
  const beltW = W + 40;
  const beltH = scene.beltHeight;
  const beltY = scene.beltTop;

  ctx.fillStyle = "rgba(12, 20, 28, 0.24)";
  roundRect(ctx, beltX + 6, beltY + 12, beltW, beltH, 8);
  ctx.fill();

  ctx.fillStyle = "#2f3b46";
  roundRect(ctx, beltX, beltY, beltW, beltH, 8);
  ctx.fill();

  ctx.fillStyle = "#3f4c58";
  ctx.fillRect(beltX, scene.beltY - beltH * 0.18, beltW, beltH * 0.36);

  ctx.strokeStyle = "#9aa6b2";
  ctx.lineWidth = 5;
  for (let x = -80 - conveyorOffset; x < W + 80; x += 52) {
    ctx.beginPath();
    ctx.moveTo(x, beltY + 9);
    ctx.lineTo(x + 26, beltY + beltH - 9);
    ctx.stroke();
  }

  for (let x = 24; x < W + 80; x += 148) {
    drawRoller(x, scene.beltY, beltH * 0.34);
  }

  ctx.fillStyle = "#202a33";
  ctx.fillRect(0, scene.beltBottom - 8, W, 16);
}

function drawRoller(x, y, r) {
  ctx.fillStyle = "#18212a";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#d6dde5";
  ctx.beginPath();
  ctx.arc(x, y, r * 0.48, 0, Math.PI * 2);
  ctx.fill();
}

function drawItems() {
  for (const item of activeItems) {
    drawItem(item);
  }
}

function drawItem(item) {
  const rect = getItemRect(item);
  ctx.save();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(19, 31, 43, 0.26)";
  roundRect(ctx, rect.left + 5, rect.top + 7, item.width, item.height, 8);
  ctx.fill();

  const flashColor = item.flash > 0 ? `rgba(239, 71, 111, ${0.24 * item.flash})` : "rgba(255, 255, 255, 0)";
  ctx.fillStyle = "#fffaf0";
  roundRect(ctx, rect.left, rect.top, item.width, item.height, 8);
  ctx.fill();
  ctx.fillStyle = flashColor;
  roundRect(ctx, rect.left, rect.top, item.width, item.height, 8);
  ctx.fill();

  ctx.strokeStyle = "#1f2937";
  ctx.lineWidth = 3;
  roundRect(ctx, rect.left, rect.top, item.width, item.height, 8);
  ctx.stroke();

  ctx.font = thaiFont(item.fontSize);
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#111827";
  ctx.fillText(item.text, item.x + item.padding, item.y + 1);
  ctx.restore();
}

function drawFragments() {
  for (const fragment of fallingFragments) {
    ctx.save();
    ctx.globalAlpha = fragment.alpha;
    ctx.translate(fragment.x, fragment.y);
    ctx.rotate(fragment.rotation);
    ctx.font = thaiFont(fragment.fontSize);
    ctx.textBaseline = "middle";
    ctx.fillStyle = fragment.color;
    ctx.shadowColor = "rgba(15, 23, 42, 0.28)";
    ctx.shadowBlur = 8;
    ctx.fillText(fragment.text, 0, 0);
    ctx.restore();
  }
}

function drawBoxBack() {
  const { boxX, boxY, boxWidth, boxHeight } = scene;

  ctx.fillStyle = "#8f542c";
  ctx.beginPath();
  ctx.moveTo(boxX + 8, boxY + boxHeight * 0.24);
  ctx.lineTo(boxX + boxWidth - 8, boxY + boxHeight * 0.24);
  ctx.lineTo(boxX + boxWidth - 18, boxY + boxHeight);
  ctx.lineTo(boxX + 18, boxY + boxHeight);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#c9823c";
  ctx.beginPath();
  ctx.moveTo(boxX + 8, boxY + boxHeight * 0.24);
  ctx.lineTo(boxX + boxWidth * 0.5, boxY + boxHeight * 0.03);
  ctx.lineTo(boxX + boxWidth - 8, boxY + boxHeight * 0.24);
  ctx.lineTo(boxX + boxWidth * 0.5, boxY + boxHeight * 0.43);
  ctx.closePath();
  ctx.fill();
}

function drawBoxFront() {
  const { boxX, boxY, boxWidth, boxHeight } = scene;

  ctx.fillStyle = "#b96d33";
  ctx.beginPath();
  ctx.moveTo(boxX + 18, boxY + boxHeight * 0.4);
  ctx.lineTo(boxX + boxWidth - 18, boxY + boxHeight * 0.4);
  ctx.lineTo(boxX + boxWidth - 18, boxY + boxHeight);
  ctx.lineTo(boxX + 18, boxY + boxHeight);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#6f3d20";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.fillStyle = "rgba(255, 225, 156, 0.52)";
  ctx.fillRect(boxX + boxWidth * 0.46, boxY + boxHeight * 0.42, boxWidth * 0.08, boxHeight * 0.55);

  ctx.strokeStyle = "#6f3d20";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(boxX + 22, boxY + boxHeight * 0.4);
  ctx.lineTo(boxX + boxWidth - 22, boxY + boxHeight * 0.4);
  ctx.stroke();
}

function drawParticles() {
  for (const particle of particles) {
    const alpha = clamp(particle.life / particle.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = particle.color;
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawScorePops() {
  for (const pop of scorePops) {
    const alpha = clamp(pop.life / pop.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = thaiFont(24, 900);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffd166";
    ctx.strokeStyle = "#17212b";
    ctx.lineWidth = 4;
    ctx.strokeText(pop.text, pop.x, pop.y);
    ctx.fillText(pop.text, pop.x, pop.y);
    ctx.restore();
  }
}

function drawSlashTrail() {
  if (slashTrail.length < 2) return;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (let i = 1; i < slashTrail.length; i++) {
    const prev = slashTrail[i - 1];
    const curr = slashTrail[i];
    const alpha = clamp(curr.life, 0, 1);

    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.lineWidth = 8 * alpha;
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(curr.x, curr.y);
    ctx.stroke();

    ctx.strokeStyle = `rgba(17, 138, 178, ${alpha * 0.72})`;
    ctx.lineWidth = 3 * alpha;
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(context, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  context.beginPath();
  context.moveTo(x + r, y);
  context.lineTo(x + width - r, y);
  context.quadraticCurveTo(x + width, y, x + width, y + r);
  context.lineTo(x + width, y + height - r);
  context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  context.lineTo(x + r, y + height);
  context.quadraticCurveTo(x, y + height, x, y + height - r);
  context.lineTo(x, y + r);
  context.quadraticCurveTo(x, y, x + r, y);
  context.closePath();
}

function gameLoop(timestamp) {
  if (!gameRunning) return;

  const dt = lastTime ? Math.min(34, timestamp - lastTime) : 16;
  lastTime = timestamp;
  update(dt);
  draw();
  animFrame = requestAnimationFrame(gameLoop);
}

function startGame() {
  score = 0;
  lives = 3;
  combo = 0;
  runTime = 0;
  activeItems = [];
  fallingFragments = [];
  particles = [];
  scorePops = [];
  slashTrail = [];
  spawnTimer = 900;
  lastTime = 0;
  itemSequence = 0;
  gameRunning = true;
  updateUI();
  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  finalScoreEl.textContent = score;
  gameOverScreen.style.display = "flex";
}

function getPointerPos(event) {
  return {
    x: event.clientX,
    y: event.clientY
  };
}

canvas.addEventListener("pointerdown", (event) => {
  if (!gameRunning) return;

  event.preventDefault();
  isPointerDown = true;
  canvas.setPointerCapture(event.pointerId);
  const pos = getPointerPos(event);
  pointerPath = [pos];
  slashTrail.push({ ...pos, life: 1 });
});

canvas.addEventListener("pointermove", (event) => {
  if (!isPointerDown || !gameRunning) return;

  event.preventDefault();
  const pos = getPointerPos(event);
  pointerPath.push(pos);
  slashTrail.push({ ...pos, life: 1 });

  if (pointerPath.length >= 2) {
    const prev = pointerPath[pointerPath.length - 2];
    checkSlice(prev.x, prev.y, pos.x, pos.y);
  }
});

function endPointer(event) {
  if (event) event.preventDefault();
  isPointerDown = false;
  pointerPath = [];
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => {
  if (!isPointerDown) return;
  isPointerDown = false;
  pointerPath = [];
});

for (const button of levelButtons) {
  button.addEventListener("click", () => setLevel(button.dataset.level));
}

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("restart-btn").addEventListener("click", startGame);
window.addEventListener("resize", resize);

updateUI();
resize();
</script>
